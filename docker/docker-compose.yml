services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${SUPERCLAW_DB_NAME:-superclaw}
      MYSQL_USER: ${SUPERCLAW_DB_USER:-superclaw}
      MYSQL_PASSWORD: ${SUPERCLAW_DB_PASSWORD:?SUPERCLAW_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${SUPERCLAW_DB_ROOT_PASSWORD:?SUPERCLAW_DB_ROOT_PASSWORD is required}
    volumes:
      - superclaw_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  superclaw:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${SUPERCLAW_PUBLIC_PORT:-8980}:8980"
    environment:
      SUPERCLAW_AUTH_REQUIRED: "true"
      SUPERCLAW_AUTH_SECRET: ${SUPERCLAW_AUTH_SECRET:?SUPERCLAW_AUTH_SECRET is required}
      SUPERCLAW_CORS_ORIGINS: ${SUPERCLAW_CORS_ORIGINS:?SUPERCLAW_CORS_ORIGINS is required}
      SUPERCLAW_DB_HOST: mysql
      SUPERCLAW_DB_PORT: "3306"
      SUPERCLAW_DB_NAME: ${SUPERCLAW_DB_NAME:-superclaw}
      SUPERCLAW_DB_USER: ${SUPERCLAW_DB_USER:-superclaw}
      SUPERCLAW_DB_PASSWORD: ${SUPERCLAW_DB_PASSWORD:?SUPERCLAW_DB_PASSWORD is required}
      SUPERCLAW_EXECUTION_MODE: api
      SUPERCLAW_SCREENSHOT_ROOT: /data/screenshots/hongguo
      XIAOMI_API_KEY: ${XIAOMI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ${SUPERCLAW_SCREENSHOT_PATH:-../data/screenshots}:/data/screenshots

volumes:
  superclaw_mysql:
