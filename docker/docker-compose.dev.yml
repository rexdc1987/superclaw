services:
  mysql:
    image: mysql:8.4
    container_name: superclaw-dev-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SUPERCLAW_DB_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: ${SUPERCLAW_DB_NAME:-superclaw}
      MYSQL_USER: ${SUPERCLAW_DB_USER:-superclaw}
      MYSQL_PASSWORD: ${SUPERCLAW_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${SUPERCLAW_DB_ROOT_PASSWORD}
    volumes:
      - superclaw_dev_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  superclaw_dev_mysql:
